[package]
name = "libbladerf-rs"
version = "0.6.0"
edition = "2024"
rust-version = "1.88.0"
authors = ["Ratzrattillo <11601995+ratzrattillo@users.noreply.github.com>"]
repository = "https://github.com/ratzrattillo/seify-bladerf"
description = "Fully Rust native BladeRF driver"
license = "Apache-2.0"
keywords = ["sdr", "rf", "bladerf"]
categories = [
    "hardware-support",
    "science",
]

[workspace]
members = [".", "examples/calibrate", "examples/dc-cal-table", "examples/flash-firmware", "examples/flash-fpga", "examples/info", "examples/rx-async", "examples/rx-tx"]

[dependencies]
thiserror = "2.0"
nusb = "0.2.7"
log = "0.4"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
futures-timer = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { version = "3", features = ["wasm-bindgen"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
env_logger = "0.11"
husky-rs = { version = "0.4"}
tokio = { version = "1", features = ["rt", "macros", "time"] }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[features]
default = ["xb100", "xb200", "xb300"]

# BladeRF1 support (x40/x115)
bladerf1 = []

# BladeRF2 support (xA4/xA9)
bladerf2 = []

# JSON DC calibration table serialization: serde derives on the calibration
# types plus `DcCalTable::load`/`save` and the filesystem auto-load helpers.
serde = ["dep:serde", "dep:serde_json"]

# Expansion board support (requires bladerf1)
xb100 = ["bladerf1"]
xb200 = ["bladerf1"]
xb300 = ["bladerf1"]

# Async runtime integration for nusb's blocking operations (device open,
# interface claim, alternate setting, clear halt), mirroring nusb's own
# `smol`/`tokio` features. Needed only to `.await` on native targets; the
# blocking `.wait()` path runs those syscalls inline and needs no runtime.
# Neither is a default feature: enable one only when you `.await`. `smol`
# (the executor-agnostic `blocking` thread pool) works under any executor;
# `tokio` uses `spawn_blocking` and requires a tokio runtime. If both are
# enabled nusb uses `smol`. Neither is needed on wasm32.
smol = ["nusb/smol"]
tokio = ["nusb/tokio"]

# Configure docs.rs. `bladerf2` is intentionally excluded: it is a
# compile_error! stub, and `--all-features` would fail the build. Default
# features provide bladerf1 (via xb100/xb200/xb300); the opt-in `serde` and
# runtime (`smol`/`tokio`) features are listed so their APIs appear in the docs.
[package.metadata.docs.rs]
features = ["serde", "smol", "tokio"]
rustdoc-args = ["--cfg", "docsrs"]

[profile.prof]
inherits = "release"
debug = true
lto = false

[[test]]
name = "bladerf1"
path = "tests/bladerf1/main.rs"
required-features = ["bladerf1"]

[[test]]
name = "bladerf1_async"
path = "tests/bladerf1_async/main.rs"
required-features = ["bladerf1", "tokio"]

[[test]]
name = "unit"
path = "tests/unit/main.rs"

[[test]]
name = "public_api"
required-features = ["bladerf1"]

[[bench]]
name = "nios_packet_bench"
harness = false

[[bench]]
name = "sample_format_bench"
harness = false

[[bench]]
name = "metadata_header_bench"
harness = false

[[bench]]
name = "hardware_gpio_bench"
harness = false
required-features = ["bladerf1"]

[[bench]]
name = "hardware_tuning_bench"
harness = false
required-features = ["bladerf1"]

[[bench]]
name = "hardware_stream_latency_bench"
harness = false
required-features = ["bladerf1"]

[[bench]]
name = "hardware_stream_build_teardown_bench"
harness = false
required-features = ["bladerf1"]

[[bench]]
name = "hardware_gain_bench"
harness = false
required-features = ["bladerf1"]

[[bench]]
name = "hardware_calibration_bench"
harness = false
required-features = ["bladerf1"]
