[package]
name = "libbladerf-rs"
version = "0.5.0"
edition = "2024"
rust-version = "1.96"
authors = ["Ratzrattillo <11601995+ratzrattillo@users.noreply.github.com>"]
repository = "https://github.com/ratzrattillo/seify-bladerf"
description = "Fully Rust native BladeRF driver"
license = "Apache-2.0"
keywords = ["sdr", "rf", "bladerf"]
categories = [
    "hardware-support",
    "science",
]

[workspace]
members = [".", "examples/calibrate", "examples/dc-cal-table", "examples/flash-firmware", "examples/flash-fpga", "examples/info", "examples/rx-async", "examples/rx-tx"]

[dependencies]
thiserror = "2.0"
nusb = "0.2.7"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-timer = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["rt"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { version = "3", features = ["wasm-bindgen"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
env_logger = "0.11"
husky-rs = { version = "0.4"}
tokio = { version = "1", features = ["rt", "macros", "time"] }

[features]
default = ["xb100", "xb200", "xb300", "smol"]

# BladeRF1 support (x40/x115)
bladerf1 = []

# BladeRF2 support (xA4/xA9)
bladerf2 = []

# Expansion board support (requires bladerf1)
xb100 = ["bladerf1"]
xb200 = ["bladerf1"]
xb300 = ["bladerf1"]

# Runtime integration for nusb's blocking operations (device open, interface
# claim, alternate setting, clear halt), mirroring nusb's own `smol`/`tokio`
# features. One of them is required on native targets; `smol` (the
# executor-agnostic `blocking` thread pool) is the default. If both are
# enabled nusb uses `smol`. Neither is needed on wasm32.
smol = ["nusb/smol"]
tokio = ["nusb/tokio", "dep:tokio"]

# Configure docs.rs to show all features
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.prof]
inherits = "release"
debug = true
lto = false

[[test]]
name = "bladerf1"
path = "tests/bladerf1/main.rs"
required-features = ["bladerf1"]

[[test]]
name = "bladerf1_async"
path = "tests/bladerf1_async/main.rs"
required-features = ["bladerf1", "tokio"]

[[test]]
name = "unit"
path = "tests/unit/main.rs"

[[test]]
name = "public_api"
required-features = ["bladerf1"]

[[bench]]
name = "nios_packet_bench"
harness = false

[[bench]]
name = "sample_format_bench"
harness = false

[[bench]]
name = "metadata_header_bench"
harness = false

[[bench]]
name = "hardware_gpio_bench"
harness = false
required-features = ["bladerf1"]

[[bench]]
name = "hardware_tuning_bench"
harness = false
required-features = ["bladerf1"]

[[bench]]
name = "hardware_stream_latency_bench"
harness = false
required-features = ["bladerf1"]

[[bench]]
name = "hardware_stream_build_teardown_bench"
harness = false
required-features = ["bladerf1"]

[[bench]]
name = "hardware_gain_bench"
harness = false
required-features = ["bladerf1"]

[[bench]]
name = "hardware_calibration_bench"
harness = false
required-features = ["bladerf1"]
